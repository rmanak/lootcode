  <polygon points="88.0,123 111.0,142 105.0,142 105.0,165 71.0,165 71.0,142 65.0,142" fill="#fff" stroke="#1f2430" stroke-width="2" stroke-linejoin="round"/><text x="88" y="154" fill="#1f2430" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
